<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Web Assistant — Settings</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f8f9fc;
        color: #1a1a2e;
        display: flex;
        justify-content: center;
        padding: 40px 20px;
      }
      .card {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        padding: 28px 32px;
        width: 100%;
        max-width: 480px;
      }
      h1 {
        font-size: 18px;
        margin-bottom: 20px;
        color: #2d3561;
      }
      .field {
        margin-bottom: 16px;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: #4a4d5e;
        margin-bottom: 6px;
      }
      input, select {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid #dfe1e8;
        border-radius: 8px;
        font-size: 13px;
        color: #2d3561;
        outline: none;
        transition: border-color 0.15s;
      }
      input:focus, select:focus {
        border-color: #6c5ce7;
      }
      .hint {
        font-size: 11px;
        color: #8b8fa3;
        margin-top: 4px;
      }
      button {
        padding: 9px 24px;
        background: #6c5ce7;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        margin-top: 8px;
      }
      button:hover { background: #5b4cc4; }
      .toast {
        display: none;
        margin-top: 12px;
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 12px;
        text-align: center;
      }
      .toast.success { display: block; background: #e8f8ef; color: #27ae60; }
      .toast.error { display: block; background: #fde8e8; color: #e74c3c; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Settings</h1>

      <div class="field">
        <label for="api-key">API Key</label>
        <input type="password" id="api-key" placeholder="Enter your API key" />
        <div class="hint">Stored locally in Chrome storage, never sent to any third party.</div>
      </div>

      <div class="field">
        <label for="api-base-url">API Base URL</label>
        <input type="text" id="api-base-url" placeholder="https://open.bigmodel.cn/api/anthropic" />
        <div class="hint">Anthropic-compatible API endpoint.</div>
      </div>

      <div class="field">
        <label for="model">Model</label>
        <input type="text" id="model" placeholder="glm-5" />
      </div>

      <div class="field">
        <label for="max-tokens">Max Tokens</label>
        <input type="number" id="max-tokens" placeholder="1024" min="128" max="4096" />
      </div>

      <button id="save-btn">Save</button>
      <div class="toast" id="toast"></div>
    </div>

    <script src="options.js"></script>
  </body>
</html>
